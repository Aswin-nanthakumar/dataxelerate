name: URBANFLOW CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend · Jest + coverage gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Verify server boots on zero-config memory adapter
        run: |
          node src/index.js & SERVER=$!
          sleep 3
          curl -fsS http://127.0.0.1:4000/health
          curl -fsS http://127.0.0.1:4000/health/ready
          kill $SERVER

  ai-service-tests:
    name: AI service · Pytest (XGBoost/LightGBM)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: ai-service/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Verify service boots and forecasts
        run: |
          uvicorn app.main:app --port 8000 & sleep 4
          curl -fsS http://127.0.0.1:8000/health

  frontend-tests:
    name: Frontend · Vitest + production build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e-smoke:
    name: Full-stack smoke (28 checks)
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-service-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: (cd backend && npm ci)
      - run: (cd ai-service && pip install -r requirements.txt)
      - run: bash scripts/smoke.sh

  deploy:
    name: Deploy (Render + Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-tests, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploys (backend + AI service)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
          fi
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_AI }}" ]; then
            curl -fS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AI }}"
          fi
      - name: Deploy frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
